<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCM Digital Songbook</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <p class="tagline">Union of Christian Movement</p>
        <div class="hero">
            <div class="logo-wrapper">
                <img src="https://images.unsplash.com/photo-1544427920-c49ccfb85579?q=80&w=400&auto=format&fit=crop" alt="CE Logo" class="logo">
            </div>
            <div class="hero-text">
                <h1>UCM</h1>
                <h2>CE Society</h2>
                <div class="gold-divider"></div>
                <h3 class="gold-heading">Youth Retreat 2026</h3>
                <div class="gold-divider small"></div>
                <h4>SONGS</h4>
            </div>
            <div class="logo-wrapper">
                <img src="https://images.unsplash.com/photo-1519817650390-64a93db51149?q=80&w=400&auto=format&fit=crop" alt="Cross Logo" class="logo">
            </div>
        </div>
    </header>

    <main class="content">
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="search" placeholder="Search song title, lyrics, or #number...">
        </div>

        <div id="song-list">
            <!-- Dynamic Song List Renders Here -->
        </div>

        <div id="lyrics-box" style="display: none;">
            <!-- Dynamic Lyrics View Renders Here -->
        </div>
    </main>

    <!-- FULLSCREEN PRESENTATION OVERLAY -->
    <div id="presentation-overlay" class="pres-overlay" style="display: none;">
        <div class="pres-header">
            <div class="pres-controls">
                <!-- Eye Icon: Toggle English Transliteration -->
                <button id="pres-eye-btn" class="pres-icon-btn" onclick="toggleTransliteration()" title="Toggle Transliteration">👁️</button>
                
                <!-- Play/Pause Icon: Blank Screen Toggle -->
                <button id="pres-play-btn" class="pres-icon-btn" onclick="togglePlayPause()" title="Pause (Blank Screen)">⏸️</button>
                
                <!-- Fullscreen Toggle Icon -->
                <button id="pres-fullscreen-btn" class="pres-icon-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">⛶</button>
            </div>
            <button class="pres-icon-btn close-pres-btn" onclick="exitPresentation()" title="Close Presentation">✕</button>
        </div>

        <div class="pres-slide-body" onclick="nextSlide(event)">
            <div id="pres-content" class="pres-content slide-fade-in">
                <!-- Slide Lyrics Render Here -->
            </div>
        </div>

        <div class="pres-footer">
            <button class="pres-nav-btn" onclick="prevSlide(event)">❮</button>
            <div class="pres-info">
                <div id="pres-title" class="pres-song-title">Song Title</div>
                <div id="pres-upnext" class="pres-upnext">Up next: verse 2</div>
            </div>
            <span id="pres-counter" class="pres-counter">1 / 1</span>
            <button class="pres-nav-btn" onclick="nextSlide(event)">❯</button>
        </div>
    </div>

    <footer>
        <p>UCM CE Society Youth Retreat 2026</p>
        <small>Sing with Joy & Praise</small>
    </footer>

    <script src="script.js"></script>
</body>
</html>
