<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCM Digital Songbook</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <p class="tagline">W e &nbsp; P r e a c h &nbsp; J e s u s &nbsp; T h e &nbsp; L i v i n g &nbsp; S a v i o u r</p>

        <div class="hero">
            <!-- Left Logo -->
            <div class="logo-wrapper">
                <img src="ChurchPNG.png" class="logo left-logo" alt="Church Logo">
            </div>

            <!-- Center Header Content -->
            <div class="hero-text">
                <h1><span class="cross">†</span> UNITED CHURCH</h1>
                <h2>Malkapuram</h2>
                <div class="gold-divider"></div>
                <h3 class="gold-heading">Christian Endeavour Society</h3>
                <div class="gold-divider small"></div>
                <h4>Youth Retreat 2026</h4>
            </div>

            <!-- Right Logo -->
            <div class="logo-wrapper">
                <img src="ce-logo.png" class="logo right-logo" alt="CE Logo">
            </div>
        </div>
    </header>

    <main class="content">
        <!-- Search Input -->
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="search" placeholder="Search Songs...">
        </div>

        <!-- Dynamic Song List -->
        <div id="song-list"></div>

        <!-- Lyrics Modal Box -->
        <div id="lyrics-box" style="display: none;"></div>
    </main>

    <footer>
        <p>✝ United Church Malkapuram</p>
        <p>Christian Endeavour Society — Youth Retreat 2026</p>
        <small>Made with ❤️ for God's Glory</small>
    </footer>

    <script src="script.js"></script>
</body>

</html>
