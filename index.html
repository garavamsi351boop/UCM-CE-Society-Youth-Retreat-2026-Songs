<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCM Digital Songbook</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <p class="tagline">W e &nbsp; P r e a c h &nbsp; J e s u s &nbsp; T h e &nbsp; L i v i n g &nbsp; S a v i o u r</p>

        <div class="hero">
            <div class="logo-wrapper">
                <img src="ChurchPNG.png" class="logo left-logo" alt="Church Logo">
            </div>

            <div class="hero-text">
                <h1>UNITED CHURCH</h1>
                <h2>Malkapuram</h2>
                <div class="gold-divider"></div>
                <h3 class="gold-heading">Christian Endeavour Society</h3>
                <div class="gold-divider small"></div>
                <h4>Youth Retreat 2026</h4>
            </div>

            <div class="logo-wrapper">
                <img src="ce-logo.png" class="logo right-logo" alt="CE Logo">
            </div>
        </div>
    </header>

    <main class="content">
        <!-- Search Bar -->
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="search" placeholder="Search by song name or number (e.g. 1, #02)...">
        </div>

        <!-- Song List -->
        <div id="song-list"></div>

        <!-- Lyrics Box -->
        <div id="lyrics-box" style="display: none;"></div>
    </main>

    <!-- FULL SCREEN PRESENTATION OVERLAY -->
    <div id="presentation-overlay" class="pres-overlay" style="display: none;">
        <div class="pres-header">
            <button class="pres-icon-btn" onclick="exitPresentation()">✕</button>
        </div>

        <!-- Tapping on this central area displays the next verse -->
        <div class="pres-slide-body" onclick="nextSlide()">
            <div id="pres-content" class="pres-content"></div>
        </div>

        <!-- Bottom Controls -->
        <div class="pres-footer">
            <button class="pres-nav-btn" onclick="prevSlide(event)">❮</button>
            <div class="pres-info">
                <div id="pres-title" class="pres-song-title"></div>
                <div id="pres-upnext" class="pres-upnext">Up next: verse 1</div>
            </div>
            <span id="pres-counter" class="pres-counter">1 / 1</span>
            <button class="pres-nav-btn" onclick="nextSlide(event)">❯</button>
        </div>
    </div>

    <!-- Transparent Footer -->
    <footer>
        <p>United Church Malkapuram</p>
        <p>Christian Endeavour Society — Youth Retreat 2026</p>
        <small>Made with ❤️ for God's Glory</small>
    </footer>

    <script src="script.js"></script>
</body>

</html>
